# ENG-167. Included per-location by nginx.conf: nginx drops inherited add_header at any
# scope that defines its own, and each location sets Cache-Control. connect-src lists what
# the web build fetches at runtime: backend API, Google Cloud Storage (upload/playback),
# and CanvasKit from www.gstatic.com plus its Noto/Roboto fallback fonts from fonts.gstatic.com
# (fetched via XHR, hence connect-src, not font-src). sql.js is self-hosted same-origin
# (ENG-130), so 'self' covers it. Keep in sync with web/index.html.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://tripod-backend.shemaywam.com https://storage.googleapis.com https://www.gstatic.com https://fonts.gstatic.com; media-src 'self' https://storage.googleapis.com blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
