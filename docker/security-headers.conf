# ENG-167. Included per-location by nginx.conf: nginx drops inherited add_header at any
# scope that defines its own, and each location sets Cache-Control. connect-src lists what
# the web build fetches at runtime: backend API, Google Cloud Storage (upload/playback),
# CanvasKit (www.gstatic.com) and its Noto/Roboto fallback fonts (fonts.gstatic.com — fetched
# via XHR, hence connect-src, not font-src), and sql.js (jsDelivr). Keep in sync with
# web/index.html (ENG-130).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://tripod-backend.shemaywam.com https://storage.googleapis.com https://www.gstatic.com https://fonts.gstatic.com https://cdn.jsdelivr.net; media-src 'self' https://storage.googleapis.com blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
