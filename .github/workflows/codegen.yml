name: Codegen

# The bare `dart` below is correct HERE and wrong on your machine. This runner
# has no FVM: subosito/flutter-action puts the pinned 3.41.5 SDK straight on the
# PATH. Locally the project's SDK is pinned by FVM, so a bare `dart` resolves to
# FVM's `stable` channel instead — it rewrites .dart_tool/package_config.json
# and downgrades the packages the Flutter SDK pins in pubspec.lock (characters,
# matcher, material_color_utilities, test_api). That matters twice as much in
# this workflow: the gate below fails on a dirty pubspec.lock, so running these
# commands locally without the prefix produces the very diff it is checking for.
#
# So: copy these steps locally as `fvm dart …`, never `dart …`.

on:
  pull_request:
    branches: [main, dev]

# Reproducibility gate: with drift/drift_dev pinned and pubspec.lock committed,
# re-running codegen must be a no-op. Fails if generated drift output or the
# committed schema fixtures drift from the source (ENG-165).
jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: "stable"
          cache: true

      - name: Install dependencies (lock must be authoritative)
        run: flutter pub get --enforce-lockfile

      - name: Regenerate drift code, step-by-step migrations, and migration-test fixtures
        run: |
          dart run drift_dev schema steps drift_schemas/ lib/core/database/schema_versions.dart
          dart run build_runner build --delete-conflicting-outputs
          dart run drift_dev schema generate --data-classes --companions drift_schemas/ test/core/database/generated/

      - name: Fail if codegen or lockfile is out of date
        run: |
          if ! git diff --exit-code -- '*.g.dart' 'lib/core/database/schema_versions.dart' 'test/core/database/generated/' pubspec.lock; then
            echo "::error::Generated code is stale. Locally these need the fvm prefix — a bare 'dart' is FVM's stable channel and will downgrade pubspec.lock, which this same gate then fails on. Run 'fvm dart run drift_dev schema steps drift_schemas/ lib/core/database/schema_versions.dart', 'fvm dart run build_runner build --delete-conflicting-outputs' and 'fvm dart run drift_dev schema generate --data-classes --companions drift_schemas/ test/core/database/generated/', then commit the result."
            exit 1
          fi
